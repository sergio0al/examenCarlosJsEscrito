<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comparador de cotxes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section>
      <h2>Targetes de Cotxes</h2>
      <div id="targetes"></div>
    </section>

    <section>
      <h2>Comparació de Cotxes</h2>
      <select id="cotxe1"></select>
      <select id="cotxe2"></select>
      <button id="btnComparar">Comparar</button>
      <p id="errorComparar" class="error"></p>
      <div id="resultatComparar"></div>
    </section>

    <section>
      <h2>Cerca de Potència</h2>
      <label for="potenciaMin">Buscar cotxes amb més de (CV):</label>
      <input type="number" id="potenciaMin">
      <button id="btnCercar">Cercar</button>
      <p id="errorCerca" class="error"></p>
      <div id="resultatCerca"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
